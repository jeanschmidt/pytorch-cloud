# Base kustomization - shared across all environments
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - nvidia-device-plugin.yaml
  - namespace.yaml
  - runner-hooks-configmap.yaml
  - runner-serviceaccount.yaml
  - storageclass-gp3.yaml
  # ARC container hook templates for job pod customization
  - arc-runner-hooks-cpu-small.yaml
  - arc-runner-hooks-cpu-medium.yaml
  - arc-runner-hooks-cpu-large.yaml
  - arc-runner-hooks-gpu-t4.yaml

# Don't set a default namespace - resources specify their own
