# Karpenter NodePool: T4 GPU Runners
# Provisions g4dn instances with NVIDIA T4 GPUs
# Note: Runner pods are lightweight - workflow CONTAINERS get GPU allocation via Kubernetes mode

apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: gpu-t4-runners
spec:
  # Limits
  limits:
    nvidia.com/gpu: "40"  # Max 40 T4 GPUs

  # Disruption settings (conservative for GPU nodes)
  disruption:
    consolidationPolicy: WhenEmpty  # Only consolidate when fully empty
    consolidateAfter: 5m  # Wait 5 minutes before terminating
    budgets:
      - nodes: "0"  # Never voluntarily disrupt nodes with running workloads

  template:
    metadata:
      labels:
        workload-type: github-runner
        nvidia.com/gpu: "true"
        nvidia.com/gpu.product: "T4"

    spec:
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]
        - key: node.kubernetes.io/instance-type
          operator: In
          values:
            - g4dn.12xlarge  # 4x T4, 48 vCPU, 192GB

      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: gpu-t4-runners

      # Taint GPU nodes - only pods requesting GPUs can schedule
      # Also taint with CPU type for resource isolation
      taints:
        - key: nvidia.com/gpu
          value: "t4"
          effect: NoSchedule
        - key: cpu-type
          value: "intel-xeon"  # g4dn instances use Intel CPUs
          effect: NoSchedule

---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: gpu-t4-runners
spec:
  # AMI Selection (AL2023 - will install NVIDIA drivers via user data)
  amiSelectorTerms:
    - alias: al2023@latest

  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "pytorch-arc-staging"

  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "pytorch-arc-staging"

  role: "pytorch-arc-staging-node-role"

  # Kubelet configuration via NodeConfig (AL2023)
  # 
  # Karpenter automatically generates the EKS join configuration (cluster endpoint,
  # CA cert, etc.) and merges it with this NodeConfig. We only specify the kubelet
  # settings that aren't available in EC2NodeClass.spec.kubelet.
  # 
  # This configures:
  # - CPU Manager: static allocation with full-pcpus-only
  # - Topology Manager: single-numa-node policy for NUMA awareness
  # - Performance: CPU governor set to performance mode
  # - GPU: NVIDIA persistence mode for consistent performance
  userData: |
    apiVersion: node.eks.aws/v1alpha1
    kind: NodeConfig
    spec:
      kubelet:
        config:
          # CPU Manager: Static allocation with full physical cores only
          cpuManagerPolicy: static
          cpuManagerPolicyOptions:
            full-pcpus-only: "true"
          
          # Topology Manager: NUMA-aware pod placement
          topologyManagerPolicy: single-numa-node
          topologyManagerScope: pod
          
          # Optional: Reserve CPUs for system daemons (kube-proxy, etc.)
          # Uncomment and adjust based on instance size if needed:
          # reservedSystemCPUs: "0-1"
      
      instance:
        # Post-bootstrap script: Configure performance settings
        localUserData: |
          #!/bin/bash
          set -euo pipefail
          
          echo "Post-bootstrap: Configuring GPU node performance settings..."
          
          # Note: NVIDIA drivers and container toolkit are pre-installed in the
          # EKS-optimized AL2023 NVIDIA AMI (amazon-eks-node-al2023-x86_64-nvidia)
          # See: https://docs.aws.amazon.com/eks/latest/userguide/ml-eks-optimized-ami.html

          # Configure CPU frequency governor for performance
          for cpu_governor in /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor; do
            if [ -f "$cpu_governor" ]; then
              echo "performance" > "$cpu_governor" || true
            fi
          done
          
          # Make CPU governor settings persistent
          cat > /etc/systemd/system/cpu-performance.service <<'EOFS'
          [Unit]
          Description=Set CPU governor to performance mode
          After=multi-user.target

          [Service]
          Type=oneshot
          ExecStart=/bin/bash -c 'for gov in /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor; do echo performance > $gov 2>/dev/null || true; done'
          RemainAfterExit=yes

          [Install]
          WantedBy=multi-user.target
          EOFS
          
          systemctl daemon-reload
          systemctl enable cpu-performance.service
          systemctl start cpu-performance.service

          # Enable GPU persistence mode for consistent performance
          # This keeps the NVIDIA driver loaded even when no processes are using the GPU
          nvidia-smi -pm 1 || true

          echo "GPU node performance configuration complete"

  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 200Gi  # Larger for GPU workloads
        volumeType: gp3
        iops: 5000
        throughput: 250
        deleteOnTermination: true
        encrypted: true

  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 1
    httpTokens: required

  tags:
    Name: "pytorch-arc-gpu-t4-runner"
    ManagedBy: "karpenter"
    NodePool: "gpu-t4-runners"
    GPUType: "T4"
