# Karpenter NodePool: T4 GPU Runners
# Provisions g4dn instances with NVIDIA T4 GPUs
# Note: Runner pods are lightweight - workflow CONTAINERS get GPU allocation via Kubernetes mode

apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: gpu-t4-runners
spec:
  # Limits
  limits:
    nvidia.com/gpu: "40"  # Max 40 T4 GPUs

  # Disruption settings (conservative for GPU nodes)
  disruption:
    consolidationPolicy: WhenEmpty  # Only consolidate when fully empty
    consolidateAfter: 5m  # Wait 5 minutes before terminating
    budgets:
      - nodes: "0"  # Never voluntarily disrupt nodes with running workloads

  template:
    metadata:
      labels:
        workload-type: github-runner
        nvidia.com/gpu: "true"
        nvidia.com/gpu.product: "T4"

    spec:
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]
        - key: node.kubernetes.io/instance-type
          operator: In
          values:
            - g4dn.xlarge    # 1x T4, 4 vCPU, 16GB
            - g4dn.2xlarge   # 1x T4, 8 vCPU, 32GB
            - g4dn.4xlarge   # 1x T4, 16 vCPU, 64GB
            - g4dn.8xlarge   # 1x T4, 32 vCPU, 128GB
            - g4dn.12xlarge  # 4x T4, 48 vCPU, 192GB

      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: gpu-t4-runners

      # Taint GPU nodes - only pods requesting GPUs can schedule
      taints:
        - key: nvidia.com/gpu
          value: "t4"
          effect: NoSchedule

---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: gpu-t4-runners
spec:
  # AMI Selection (AL2023 - will install NVIDIA drivers via user data)
  amiSelectorTerms:
    - alias: al2023@latest

  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "${CLUSTER_NAME}"

  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "${CLUSTER_NAME}"

  role: "${CLUSTER_NAME}-node-role"

  # CRITICAL: Configure kubelet AND install NVIDIA drivers
  userData: |
    MIME-Version: 1.0
    Content-Type: multipart/mixed; boundary="==BOUNDARY=="

    --==BOUNDARY==
    Content-Type: application/node.eks.aws

    ---
    apiVersion: node.eks.aws/v1alpha1
    kind: NodeConfig
    spec:
      kubelet:
        config:
          maxPods: 110
          # CPU Manager: Static policy for CPU pinning
          # CRITICAL for benchmark consistency - prevents noisy neighbor on CPU
          cpuManagerPolicy: static
          cpuManagerReconcilePeriod: 10s
          # Reserve CPUs 0-3 for system daemons on GPU nodes
          systemReserved:
            cpu: "4000m"
            memory: "4Gi"
            ephemeral-storage: "20Gi"
          kubeReserved:
            cpu: "2000m"
            memory: "2Gi"
          # Memory Manager: Static policy for NUMA-aware memory allocation
          # CRITICAL for benchmark consistency - prevents memory access penalties
          memoryManagerPolicy: Static
          # Topology Manager: single-numa-node policy
          # Ensures CPU, memory, and GPU are allocated from the same NUMA node
          # CRITICAL for GPU workloads - minimizes PCIe latency
          topologyManagerPolicy: single-numa-node
          topologyManagerScope: pod
        flags:
          - --node-labels=nvidia.com/gpu=true

    --==BOUNDARY==
    Content-Type: text/x-shellscript; charset="us-ascii"

    #!/bin/bash
    set -euxo pipefail

    echo "Installing NVIDIA drivers and configuring GPU node..."

    # Add NVIDIA CUDA repository
    dnf config-manager --add-repo \
      https://developer.download.nvidia.com/compute/cuda/repos/rhel9/x86_64/cuda-rhel9.repo

    # Install NVIDIA driver and container toolkit
    dnf clean all
    dnf install -y \
      nvidia-driver-latest-dkms \
      nvidia-container-toolkit

    # Configure containerd to use nvidia runtime
    nvidia-ctk runtime configure --runtime=containerd

    # Restart containerd
    systemctl restart containerd

    # Configure CPU frequency governor for performance
    for cpu_governor in /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor; do
      if [ -f "$cpu_governor" ]; then
        echo "performance" > "$cpu_governor"
      fi
    done
    
    # Make CPU governor settings persistent
    cat > /etc/systemd/system/cpu-performance.service <<'EOFS'
    [Unit]
    Description=Set CPU governor to performance mode
    After=multi-user.target

    [Service]
    Type=oneshot
    ExecStart=/bin/bash -c 'for gov in /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor; do echo performance > $gov 2>/dev/null || true; done'
    RemainAfterExit=yes

    [Install]
    WantedBy=multi-user.target
    EOFS
    
    systemctl daemon-reload
    systemctl enable cpu-performance.service
    systemctl start cpu-performance.service

    # Set GPU persistence mode for consistent performance
    nvidia-smi -pm 1 || true

    echo "T4 GPU node ready with CPU pinning and NUMA awareness configured"

    --==BOUNDARY==--

  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 200Gi  # Larger for GPU workloads
        volumeType: gp3
        iops: 5000
        throughput: 250
        deleteOnTermination: true
        encrypted: true

  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 1
    httpTokens: required

  tags:
    Name: "pytorch-arc-gpu-t4-runner"
    ManagedBy: "karpenter"
    NodePool: "gpu-t4-runners"
    GPUType: "T4"
