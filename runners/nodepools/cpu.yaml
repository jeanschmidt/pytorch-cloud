# Karpenter NodePool: CPU Runners
# Provisions nodes for all CPU-based runners (small, medium, large)

apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: cpu-runners
spec:
  # Limits (prevents runaway scaling)
  limits:
    cpu: "1000"
    memory: "2000Gi"

  # Disruption settings
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 30s
    budgets:
      - nodes: "10%"  # Only disrupt 10% of nodes at a time

  # Template for nodes
  template:
    metadata:
      labels:
        workload-type: github-runner

    spec:
      # Node requirements
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]  # Prefer spot (cheaper)
        - key: node.kubernetes.io/instance-type
          operator: In
          values:
            - c6i.12xlarge  # 48 vCPU, 96GB

      # Reference to EC2NodeClass
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: cpu-runners

      # Taint with CPU architecture - runners must explicitly tolerate
      # Note: We define taints per instance family in requirements below
      # Intel instances (c6i.*) get cpu-type=intel-xeon
      # AMD instances (c6a.*) get cpu-type=amd-epyc
      taints:
        - key: cpu-type
          value: "compute-optimized"  # Generic value that covers both Intel and AMD
          effect: NoSchedule

---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: cpu-runners
spec:
  # AMI Selection (Amazon Linux 2023 EKS-optimized)
  amiSelectorTerms:
    - alias: al2023@latest

  # Subnet selection (will be tagged by terraform with karpenter.sh/discovery)
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "pytorch-arc-staging"

  # Security group selection
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "pytorch-arc-staging"

  # IAM Instance Profile (created by EKS module)
  role: "pytorch-arc-staging-node-role"

  # Kubelet configuration via NodeConfig (AL2023)
  # 
  # Karpenter automatically generates the EKS join configuration (cluster endpoint,
  # CA cert, etc.) and merges it with this NodeConfig. We only specify the kubelet
  # settings that aren't available in EC2NodeClass.spec.kubelet.
  # 
  # This configures:
  # - CPU Manager: static allocation
  # - Topology Manager: single-numa-node policy for NUMA awareness
  # - Performance: CPU governor set to performance mode
  userData: |
    apiVersion: node.eks.aws/v1alpha1
    kind: NodeConfig
    spec:
      kubelet:
        config:
          # CPU Manager: Static allocation
          cpuManagerPolicy: static

          # Topology Manager: NUMA-aware pod placement
          topologyManagerPolicy: single-numa-node
          topologyManagerScope: pod

          # Optional: Reserve CPUs for system daemons (kube-proxy, etc.)
          # Uncomment and adjust based on instance size if needed:
          reservedSystemCPUs: "0-1"

      instance:
        # Post-bootstrap script: Configure CPU governor for performance
        localUserData: |
          #!/bin/bash
          set -euo pipefail
          
          echo "Post-bootstrap: Configuring CPU performance settings..."
          
          # Configure CPU frequency governor for performance
          for cpu_governor in /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor; do
            if [ -f "$cpu_governor" ]; then
              echo "performance" > "$cpu_governor" || true
            fi
          done
          
          # Make CPU governor settings persistent
          cat > /etc/systemd/system/cpu-performance.service <<'EOF'
          [Unit]
          Description=Set CPU governor to performance mode
          After=multi-user.target

          [Service]
          Type=oneshot
          ExecStart=/bin/bash -c 'for gov in /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor; do echo performance > $gov 2>/dev/null || true; done'
          RemainAfterExit=yes

          [Install]
          WantedBy=multi-user.target
          EOF
          
          systemctl daemon-reload
          systemctl enable cpu-performance.service
          systemctl start cpu-performance.service
          
          echo "CPU performance configuration complete"

  # Block device mappings
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 100Gi
        volumeType: gp3
        iops: 3000
        throughput: 125
        deleteOnTermination: true
        encrypted: true

  # Metadata options (IMDSv2 required)
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 1
    httpTokens: required

  # Tags
  tags:
    Name: "pytorch-arc-cpu-runner"
    ManagedBy: "karpenter"
    NodePool: "cpu-runners"
