# GitHub ARC GPU Runner Scale Set - Production

githubConfigUrl: "https://github.com/pytorch/pytorch"

runnerScaleSetName: "pytorch-gpu-runners-production"

minRunners: 1
maxRunners: 10

containerMode:
  type: "kubernetes"

template:
  spec:
    serviceAccountName: arc-runner
    
    nodeSelector:
      nvidia.com/gpu: "true"

    tolerations:
      - key: nvidia.com/gpu
        operator: Equal
        value: "true"
        effect: NoSchedule

    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:latest
        command: ["/home/runner/run.sh"]
        env:
          - name: RUNNER_FEATURE_FLAG_EPHEMERAL
            value: "true"
        resources:
          limits:
            cpu: "8"
            memory: "32Gi"
          requests:
            cpu: "4"
            memory: "16Gi"
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work

    volumes:
      - name: work
        ephemeral:
          volumeClaimTemplate:
            spec:
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 200Gi
              storageClassName: gp3
