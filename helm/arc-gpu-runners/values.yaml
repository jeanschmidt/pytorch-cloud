# GitHub ARC GPU Runner Scale Set - Base Values
# GPU-specific runner configuration
# Chart: oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set

# REQUIRED: GitHub configuration URL
githubConfigUrl: ""  # MUST be set via --set or values override

# REQUIRED: Name of Kubernetes secret containing GitHub credentials
githubConfigSecret: "github-secret"

# Runner scale set name
runnerScaleSetName: "pytorch-gpu-runners"

# Min/max runners (GPUs are expensive, scale to zero when idle)
minRunners: 0
maxRunners: 5

# Runner group
runnerGroup: "default"

# Container mode - use kubernetes (workflows specify container:)
containerMode:
  type: "kubernetes"

# GPU Runner template - lightweight runner, GPU allocated to workflow containers
template:
  spec:
    serviceAccountName: arc-runner

    # Node selector - only schedule on GPU nodes
    nodeSelector:
      nvidia.com/gpu: "true"

    # Tolerations - allow scheduling on tainted GPU nodes
    tolerations:
      - key: nvidia.com/gpu
        operator: Equal
        value: "true"
        effect: NoSchedule

    containers:
      - name: runner
        # Lightweight runner image - workflows specify GPU containers
        image: ghcr.io/actions/actions-runner:latest
        env:
          - name: RUNNER_FEATURE_FLAG_EPHEMERAL
            value: "true"
        resources:
          limits:
            cpu: "8"
            memory: "32Gi"
          requests:
            cpu: "4"
            memory: "16Gi"
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work

    # Volumes
    volumes:
      - name: work
        ephemeral:
          volumeClaimTemplate:
            spec:
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 100Gi
              storageClassName: gp3

# Controller service account
controllerServiceAccount:
  namespace: arc-systems
  name: arc-controller

# Listener
listenerTemplate:
  spec:
    containers:
      - name: listener
        resources:
          limits:
            cpu: "200m"
            memory: "256Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
