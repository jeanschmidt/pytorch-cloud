# GitHub ARC GPU Runner Scale Set - Staging

githubConfigUrl: "https://github.com/pytorch/pytorch-test"

runnerScaleSetName: "pytorch-gpu-runners-staging"

minRunners: 0
maxRunners: 2

containerMode:
  type: "kubernetes"

template:
  spec:
    serviceAccountName: arc-runner

    nodeSelector:
      nvidia.com/gpu: "true"

    tolerations:
      - key: nvidia.com/gpu
        operator: Equal
        value: "true"
        effect: NoSchedule

    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:latest
        env:
          - name: RUNNER_FEATURE_FLAG_EPHEMERAL
            value: "true"
        resources:
          limits:
            cpu: "4"
            memory: "16Gi"
          requests:
            cpu: "2"
            memory: "8Gi"
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work

    volumes:
      - name: work
        ephemeral:
          volumeClaimTemplate:
            spec:
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 50Gi
              storageClassName: gp3
